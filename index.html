<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yees | Multi-Category Store</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
    
    header { background: #1a1a1a; color: white; padding: 20px; text-align: center; }
    header h1 { margin: 0; font-size: 2.2rem; }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    
    .admin-panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
    .admin-panel h2 { margin-top: 0; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-field { display: flex; flex-direction: column; }
    .form-field label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #555; }
    .form-field input, .form-field select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
    .btn-submit { grid-column: 1 / -1; background: #10b981; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: #059669; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
    .card h3 { margin: 5px 0 10px 0; color: #111; }
    .category-badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
    .form-group { margin: 12px 0; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #666; }
    .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
    .price { font-size: 1.25rem; font-weight: bold; color: #2e7d32; margin: 15px 0 10px 0; }
    .btn-add { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-add:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <header>
    <h1>yees</h1>
  </header>

  <div class="container">
    
    <div class="admin-panel">
      <h2>Add New Item to yees</h2>
      <form id="productForm" class="form-grid">
        <div class="form-field">
          <label for="title">Item Name</label>
          <input type="text" id="title" placeholder="e.g. Leather Jacket" required>
        </div>
        <div class="form-field">
          <label for="category">Category</label>
          <select id="category">
            <option>Clothes</option>
            <option>Gadgets</option>
            <option>Books</option>
            <option>Shoes</option>
            <option>Cooking Utensils</option>
          </select>
        </div>
        <div class="form-field">
          <label for="price">Price ($)</label>
          <input type="number" id="price" placeholder="29.99" step="0.01" required>
        </div>
        <div class="form-field">
          <label for="imgUrl">Image URL</label>
          <input type="url" id="imgUrl" placeholder="https://images.unsplash.com/photo-..." required>
        </div>
        <div class="form-field">
          <label for="sizes">Sizes (comma-separated)</label>
          <input type="text" id="sizes" placeholder="Small, Medium, Large">
        </div>
        <div class="form-field">
          <label for="materials">Materials/Variants (comma-separated)</label>
          <input type="text" id="materials" placeholder="Cotton, Leather, Steel">
        </div>
        <button type="submit" class="btn-submit">Add Product to Store</button>
      </form>
    </div>

    <h2>Store Products</h2>
    <div class="product-grid" id="productGrid">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=500&q=80" alt="Casual Hoodie">
        <span class="category-badge">Clothes</span>
        <h3>Casual Hoodie</h3>
        <div class="form-group">
          <label>Size:</label>
          <select>
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
          </select>
        </div>
        <div class="price">$45.00</div>
        <button class="btn-add" onclick="alert('Added to cart!')">Add to Cart</button>
      </div>
    </div>

  </div>

  <script>
    const form = document.getElementById('productForm');
    const productGrid = document.getElementById('productGrid');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const price = parseFloat(document.getElementById('price').value).toFixed(2);
      const imgUrl = document.getElementById('imgUrl').value;
      const sizes = document.getElementById('sizes').value.split(',').map(s => s.trim()).filter(s => s);
      const materials = document.getElementById('materials').value.split(',').map(m => m.trim()).filter(m => m);

      const card = document.createElement('div');
      card.className = 'card';

      let optionsHTML = '';

      if (sizes.length > 0) {
        optionsHTML += `<div class="form-group"><label>Size:</label><select>`;
        sizes.forEach(s => optionsHTML += `<option>${s}</option>`);
        optionsHTML += `</select></div>`;
      }

      if (materials.length > 0) {
        optionsHTML += `<div class="form-group"><label>Material/Variant:</label><select>`;
        materials.forEach(m => optionsHTML += `<option>${m}</option>`);
        optionsHTML += `</select></div>`;
      }

      card.innerHTML = `
        <img src="${imgUrl}" alt="${title}">
        <span class="category-badge">${category}</span>
        <h3>${title}</h3>
        ${optionsHTML}
        <div class="price">$${price}</div>
        <button class="btn-add" onclick="alert('${title} added to cart!')">Add to Cart</button>
      `;

      productGrid.appendChild(card);
      form.reset();
    });
  </script>

</body>
</html>
